<svg xmlns="http://www.w3.org/2000/svg" width="820" height="210" viewBox="0 0 820 210">
<style>
.t{font:600 13px 'Segoe UI',Ubuntu,Arial,sans-serif;fill:#8b949e;letter-spacing:1px}
.n{font:800 30px 'Segoe UI',Ubuntu,Arial,sans-serif;fill:#e6edf3}
.h{font:700 15px 'Segoe UI',Ubuntu,Arial,sans-serif;fill:#22d3ee;letter-spacing:2px}
.l{font:500 12px 'Segoe UI',Ubuntu,Arial,sans-serif;fill:#c9d1d9}
.tile{animation:up .8s ease-out both}
.bar{animation:grow 1.4s ease-out both;transform-box:fill-box;transform-origin:left}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
</style>
<rect width="820" height="210" rx="14" fill="#0d1117" stroke="#21262d"/>
<text class="h" x="28" y="36">GITHUB PULSE</text>
<g class="tile" style="animation-delay:0.00s"><rect x="28" y="52" width="180" height="70" rx="10" fill="#161b22"/><text class="n" x="44" y="90">15</text><text class="t" x="44" y="110">REPOS SHIPPED</text></g>
<g class="tile" style="animation-delay:0.12s"><rect x="224" y="52" width="180" height="70" rx="10" fill="#161b22"/><text class="n" x="240" y="90">10</text><text class="t" x="240" y="110">STARS EARNED</text></g>
<g class="tile" style="animation-delay:0.24s"><rect x="420" y="52" width="180" height="70" rx="10" fill="#161b22"/><text class="n" x="436" y="90">8</text><text class="t" x="436" y="110">FOLLOWERS</text></g>
<g class="tile" style="animation-delay:0.36s"><rect x="616" y="52" width="180" height="70" rx="10" fill="#161b22"/><text class="n" x="632" y="90">10</text><text class="t" x="632" y="110">LANGUAGES USED</text></g>
<text class="t" x="28" y="150">LANGUAGES ACROSS PROJECTS</text>
<rect class="bar" style="animation-delay:0.30s" x="28.0" y="160" width="401.6" height="10" rx="3" fill="#3572A5"/>
<rect class="bar" style="animation-delay:0.40s" x="431.6" y="160" width="133.0" height="10" rx="3" fill="#f1e05a"/>
<rect class="bar" style="animation-delay:0.50s" x="566.6" y="160" width="54.7" height="10" rx="3" fill="#3178c6"/>
<rect class="bar" style="animation-delay:0.60s" x="623.2" y="160" width="53.5" height="10" rx="3" fill="#663399"/>
<rect class="bar" style="animation-delay:0.70s" x="678.7" y="160" width="48.9" height="10" rx="3" fill="#89e051"/>
<rect class="bar" style="animation-delay:0.80s" x="729.6" y="160" width="48.9" height="10" rx="3" fill="#DA5B0B"/>
